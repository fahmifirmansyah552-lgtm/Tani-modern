name: Build TANI MODERN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack TANI MODERN project
        run: |
          unzip -o "tani-modern-final.zip" -d project
          cd project/tani-modern-final
          test -f package.json
          test -f capacitor.config.ts
          test -f www/index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and create Android project
        working-directory: project/tani-modern-final
        run: |
          npm install
          npm install --sav-dev typescript
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: project/tani-modern-final/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TANI-MODERN-APK
          path: project/tani-modern-final/android/app/build/outputs/apk/debug/app-debug.apk
